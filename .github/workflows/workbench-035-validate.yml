name: EightMax Test Workbench 0.35 - validate release ZIP on Windows
# Validates the exact release ZIP in releases/ (no rebuild) on a GitHub-hosted Windows x64 runner with REAL input on its virtual
# desktop; results are committed to ci-results/0.35/ on the same branch. Hosted runner - NOT the target PC.
on:
  push:
    paths:
      - 'releases/EightMax-Test-Workbench-0.35*.zip'
      - 'workbench-ci035/validate-zip.ps1'
      - '.github/workflows/workbench-035-validate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Validate the release ZIP on Windows
        shell: powershell
        run: |
          $zip = Get-ChildItem releases -Filter 'EightMax-Test-Workbench-0.35*.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) { New-Item -ItemType Directory -Force C:\em035-results | Out-Null; Set-Content C:\em035-results\no-candidate.txt 'No 0.35 release ZIP in this commit.'; exit 0 }
          ./workbench-ci035/validate-zip.ps1 -Zip $zip.FullName
      - name: Publish results to ci-results/0.35 on this branch
        if: always()
        shell: powershell
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./workbench-ci035/publish.ps1 -Source C:\em035-results
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-0.35-validate
          path: C:\em035-results
          if-no-files-found: warn
