name: EightMax 5.17 - the launchers on a hosted Windows runner
# Runs the two launchers a user double-clicks, with Windows PowerShell 5.1, on a hosted Windows runner.
#   * If release-5.17/EightMax-Windows-5.17.zip is in the branch, it is the DELIVERED archive that runs: it is checked
#     against its identity file and extracted into an empty folder.
#   * Otherwise ci/EightMax-5.17-prerelease.zip runs: the executables, the fixtures, the scripts and the reference
#     files the launchers read, taken from the tree before packaging (no SHA256SUMS.txt: the integrity pass is skipped).
# A hosted runner is a virtual machine without an NVIDIA GPU: the GPU sections report themselves as skipped, and
# nothing here is evidence about the target PC, about CUDA or about method exact-hu on a graphics card.
on:
  push:
    branches: ['ccr-f7bda3fe-idkcb2']
    paths: ['release-5.17/EightMax-Windows-5.17.zip', 'ci/EightMax-5.17-prerelease.zip', '.github/workflows/eightmax-5.17-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launchers:
    runs-on: windows-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            release-5.17
            ci
      - name: Which archive; identity; extraction
        shell: powershell
        run: |
          $rel = 'release-5.17/EightMax-Windows-5.17.zip'
          if (Test-Path $rel) {
            $id = Get-Content release-5.17/EightMax-Windows-5.17.identity.json -Raw | ConvertFrom-Json
            $h = (Get-FileHash $rel -Algorithm SHA256).Hash.ToLower()
            "DELIVERED archive: sha256 $h; identity file $($id.archiveSha256); build $($id.build)"
            if ($h -ne $id.archiveSha256) { 'the archive is not the one the identity file describes'; exit 1 }
            $zip = $rel
          } else {
            $zip = 'ci/EightMax-5.17-prerelease.zip'
            "PRE-RELEASE tree: sha256 " + (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP\em517
          Get-CimInstance Win32_OperatingSystem | ForEach-Object { $_.Caption + ' ' + $_.Version }
          Get-CimInstance Win32_Processor | ForEach-Object { $_.Name + '; ' + $_.NumberOfLogicalProcessors + ' logical processors' }
          'RAM GiB: ' + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          $PSVersionTable.PSVersion.ToString()
          & "$env:RUNNER_TEMP\em517\EightMax\mwcli.exe" --build-id
          'OpenCL on this runner (method exact-hu needs a GPU with double precision; without one its device checks are skipped):'
          & "$env:RUNNER_TEMP\em517\EightMax\mwcli.exe" --opencl-info
      - name: Run 5.17 focused validation.bat
        shell: cmd
        env:
          EIGHTMAX_NO_PAUSE: '1'
        run: |
          cd /d "%RUNNER_TEMP%\em517\EightMax"
          call "Run 5.17 focused validation.bat"
          echo focused launcher exit status %errorlevel% > focused-exit.txt
          type focused-exit.txt
          exit /b 0
      - name: Focused report
        if: always()
        shell: powershell
        run: |
          cd "$env:RUNNER_TEMP\em517\EightMax"
          if (Test-Path Windows-focused-validation-5.17.txt) { Get-Content Windows-focused-validation-5.17.txt } else { 'no focused report was written' }
      - name: Run 5.17 Windows validation.bat (no GPU on the runner)
        shell: cmd
        env:
          EIGHTMAX_NO_PAUSE: '1'
        run: |
          cd /d "%RUNNER_TEMP%\em517\EightMax"
          call "Run 5.17 Windows validation.bat"
          echo full launcher exit status %errorlevel% > full-exit.txt
          type full-exit.txt
          exit /b 0
      - name: Full report
        if: always()
        shell: powershell
        run: |
          cd "$env:RUNNER_TEMP\em517\EightMax"
          if (Test-Path Windows-validation-5.17.txt) { Get-Content Windows-validation-5.17.txt } else { 'no full report was written' }
      - name: Collect the reports
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          Copy-Item "$env:RUNNER_TEMP\em517\EightMax\Windows-*.json", "$env:RUNNER_TEMP\em517\EightMax\Windows-*.txt", "$env:RUNNER_TEMP\em517\EightMax\*-exit.txt", "$env:RUNNER_TEMP\em517\EightMax\hardware-validation.json" reports -ErrorAction SilentlyContinue
          Get-ChildItem reports | ForEach-Object { $_.Name + ' ' + $_.Length }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EightMax-5.17-windows-runner-reports
          path: reports/
      - name: Result (fails the job if a launcher did not return 0)
        shell: powershell
        run: |
          $f = Get-Content "$env:RUNNER_TEMP\em517\EightMax\focused-exit.txt" -ErrorAction SilentlyContinue; $a = Get-Content "$env:RUNNER_TEMP\em517\EightMax\full-exit.txt" -ErrorAction SilentlyContinue
          "$f"; "$a"
          if ("$f" -notmatch 'status 0\s*$' -or "$a" -notmatch 'status 0\s*$') { exit 1 }
