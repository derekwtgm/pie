name: EightMax 5.11 - delivered archive on a hosted Windows runner
# Runs the DELIVERED archive (release-5.11/EightMax-Windows-5.11.zip), not a fresh build: the archive is checked
# against its identity file, extracted into an empty folder, and the two launchers a user double-clicks are run with
# Windows PowerShell 5.1. A hosted runner is a virtual machine without an NVIDIA GPU: the GPU section reports itself
# as skipped, and nothing here is evidence about the target PC or about CUDA.
on:
  push:
    branches: ['claude/eightmax-5.11-phase1-generator']
    paths: ['release-5.11/EightMax-Windows-5.11.zip', '.github/workflows/eightmax-5.11-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivered-archive:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-5.11
      - name: Archive against its identity file; extraction
        shell: powershell
        run: |
          $id = Get-Content release-5.11/EightMax-Windows-5.11.identity.json -Raw | ConvertFrom-Json
          $h = (Get-FileHash release-5.11/EightMax-Windows-5.11.zip -Algorithm SHA256).Hash.ToLower()
          "archive sha256 $h; identity file $($id.archiveSha256); build $($id.build)"
          if ($h -ne $id.archiveSha256) { 'the archive is not the one the identity file describes'; exit 1 }
          Expand-Archive release-5.11/EightMax-Windows-5.11.zip -DestinationPath $env:RUNNER_TEMP\em511
          Get-CimInstance Win32_OperatingSystem | ForEach-Object { $_.Caption + ' ' + $_.Version }
          Get-CimInstance Win32_Processor | ForEach-Object { $_.Name + '; ' + $_.NumberOfLogicalProcessors + ' logical processors' }
          $PSVersionTable.PSVersion.ToString()
          & "$env:RUNNER_TEMP\em511\EightMax\mwcli.exe" --build-id
      - name: Run 5.11 focused validation.bat
        shell: cmd
        env:
          EIGHTMAX_NO_PAUSE: '1'
        run: |
          cd /d "%RUNNER_TEMP%\em511\EightMax"
          call "Run 5.11 focused validation.bat"
          echo focused launcher exit status %errorlevel% > focused-exit.txt
          type focused-exit.txt
          exit /b 0
      - name: Focused report
        if: always()
        shell: powershell
        run: |
          cd "$env:RUNNER_TEMP\em511\EightMax"
          if (Test-Path Windows-focused-validation-5.11.txt) { Get-Content Windows-focused-validation-5.11.txt } else { 'no focused report was written' }
      - name: Run 5.11 Windows validation.bat (no GPU on the runner)
        shell: cmd
        env:
          EIGHTMAX_NO_PAUSE: '1'
        run: |
          cd /d "%RUNNER_TEMP%\em511\EightMax"
          call "Run 5.11 Windows validation.bat"
          echo full launcher exit status %errorlevel% > full-exit.txt
          type full-exit.txt
          exit /b 0
      - name: Full report
        if: always()
        shell: powershell
        run: |
          cd "$env:RUNNER_TEMP\em511\EightMax"
          if (Test-Path Windows-validation-5.11.txt) { Get-Content Windows-validation-5.11.txt } else { 'no full report was written' }
      - name: Collect the reports
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          Copy-Item "$env:RUNNER_TEMP\em511\EightMax\Windows-*.json", "$env:RUNNER_TEMP\em511\EightMax\Windows-*.txt", "$env:RUNNER_TEMP\em511\EightMax\*-exit.txt", "$env:RUNNER_TEMP\em511\EightMax\hardware-validation.json" reports -ErrorAction SilentlyContinue
          Get-ChildItem reports | ForEach-Object { $_.Name + ' ' + $_.Length }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EightMax-5.11-windows-runner-reports
          path: reports/
      - name: Result (fails the job if a launcher did not return 0)
        shell: powershell
        run: |
          $f = Get-Content "$env:RUNNER_TEMP\em511\EightMax\focused-exit.txt" -ErrorAction SilentlyContinue; $a = Get-Content "$env:RUNNER_TEMP\em511\EightMax\full-exit.txt" -ErrorAction SilentlyContinue
          "$f"; "$a"
          if ("$f" -notmatch 'status 0\s*$' -or "$a" -notmatch 'status 0\s*$') { exit 1 }
