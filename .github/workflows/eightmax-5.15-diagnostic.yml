name: EightMax 5.15 - diagnostic (self-test 5.15, training section, repeated)
on:
  push:
    branches: ['ccr-f7bda3fe-idkcb2']
    paths: ['.github/workflows/eightmax-5.15-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ci
      - name: extract
        shell: powershell
        run: Expand-Archive ci/EightMax-5.15-prerelease.zip -DestinationPath $env:RUNNER_TEMP\em515
      - name: training section, twelve times
        shell: cmd
        run: |
          cd /d "%RUNNER_TEMP%\em515\EightMax"
          mwcli.exe --build-id
          for /L %%i in (1,1,12) do ( echo == run %%i & mwcli.exe --selftest515 studies "%RUNNER_TEMP%\w%%i" training 2>&1 | findstr /C:"T2" /C:"tool" )
          exit /b 0
